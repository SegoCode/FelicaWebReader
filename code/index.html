<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fefdfb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0b0f" media="(prefers-color-scheme: dark)">
  <title>FeliCa</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FeliCa">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:opsz,wght@14..32,400..600&display=swap" rel="stylesheet">
  <!-- Tailwind browser only compiles style[type=text/tailwindcss] and rejects a local @import. -->
  <script>
    const req = new XMLHttpRequest();
    req.open("GET", new URL("css/style.css", document.baseURI), false);
    req.send();
    const style = document.createElement("style");
    style.setAttribute("type", "text/tailwindcss");
    style.textContent = req.responseText;
    document.head.appendChild(style);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
</head>
<body class="min-h-dvh overflow-x-clip bg-background-primary font-sans text-foreground-primary antialiased">
  <div id="splash" class="fixed inset-0 z-10 flex items-center justify-center overflow-hidden bg-background-primary ps-[max(1rem,env(safe-area-inset-left))] pe-[max(1rem,env(safe-area-inset-right))] pt-[max(1rem,env(safe-area-inset-top))] pb-[max(1rem,env(safe-area-inset-bottom))]">
    <div class="flex w-full max-w-sm flex-col items-center">
      <h1 class="text-center text-lg font-medium tracking-tight text-balance">FeliCa</h1>
      <button id="splash-card" type="button" aria-label="Connect reader" class="splash-card relative mt-4 cursor-pointer touch-manipulation overflow-hidden rounded-[10px] bg-base-invert text-foreground-invert shadow-card transition-[scale,box-shadow] duration-150 ease-out-soft select-none animate-rise focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand active:scale-[0.96] disabled:cursor-default disabled:opacity-60 disabled:active:scale-100 motion-reduce:animate-none">
        <span class="absolute inset-y-3.5 left-0 w-1 rounded-r-[2px] bg-brand"></span>
        <span class="absolute right-4 top-3.5 text-sm font-medium">IC</span>
        <span class="absolute left-5 top-[42%] flex h-7 w-9 flex-col justify-center gap-1 rounded-[2px] bg-background-tertiary px-1.5">
          <span class="h-px bg-foreground-tertiary"></span>
          <span class="h-px w-2/3 bg-foreground-tertiary"></span>
        </span>
      </button>
      <p id="splash-hint" class="mt-4 text-center text-sm text-pretty text-foreground-secondary animate-fade motion-reduce:animate-none [animation-delay:50ms]">Tap the card or press the button. The browser asks permission for the reader.</p>
      <button id="splash-go" type="button" class="mt-4 inline-flex min-h-11 w-full cursor-pointer touch-manipulation items-center justify-center gap-2 rounded-[4px] bg-base-invert px-3.5 text-[15px] font-medium text-foreground-invert shadow-button transition-[scale,box-shadow] duration-150 ease-out-soft select-none hover:shadow-button-hover focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand active:scale-[0.96] disabled:cursor-default disabled:opacity-60 disabled:active:scale-100">
        <svg viewBox="0 0 16 16" class="size-4 shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="1.75" y="3.25" width="12.5" height="9.5" rx="1.5"></rect>
          <path d="M4.25 8h7.5"></path>
        </svg>
        Connect reader
      </button>
      <p id="splash-note" class="mt-3 text-center text-sm text-pretty text-foreground-secondary" aria-live="polite" hidden></p>
    </div>
  </div>
  <div id="app" hidden class="mx-auto flex min-h-dvh w-full max-w-[var(--grid-max-width)] flex-col pt-8 ps-[max(1rem,env(safe-area-inset-left))] pe-[max(1rem,env(safe-area-inset-right))] pb-[max(2rem,env(safe-area-inset-bottom))] md:px-8 md:pt-12 md:pb-12">

    <main class="grid flex-1 content-start grid-cols-1 justify-items-center gap-8 text-center md:grid-cols-[18rem_minmax(0,1fr)] md:items-start md:justify-items-start md:gap-x-16 md:gap-y-6 md:text-start">
      <div id="card-live" class="relative aspect-[856/540] w-full max-w-sm justify-self-center overflow-hidden rounded-[10px] bg-base-invert text-foreground-invert shadow-card md:col-start-1 md:row-start-1 md:max-w-none md:justify-self-stretch" aria-hidden="true">
        <span class="absolute inset-y-3.5 left-0 w-1 rounded-r-[2px] bg-brand"></span>
        <span class="absolute right-4 top-3.5 text-sm font-medium">IC</span>
        <span class="absolute left-5 top-[42%] flex h-7 w-9 flex-col justify-center gap-1 rounded-[2px] bg-background-tertiary px-1.5">
          <span class="h-px bg-foreground-tertiary"></span>
          <span class="h-px w-2/3 bg-foreground-tertiary"></span>
        </span>
      </div>
      <div id="card-away" class="relative aspect-[856/540] w-full max-w-sm justify-self-center animate-rise overflow-hidden rounded-[10px] bg-base-invert text-foreground-invert shadow-card motion-reduce:animate-none md:col-start-1 md:row-start-1 md:max-w-none md:justify-self-stretch" aria-hidden="true" hidden>
        <span class="absolute inset-y-3.5 left-0 w-1 rounded-r-[2px] bg-brand"></span>
        <span class="absolute right-4 top-3.5 text-sm font-medium">IC</span>
        <span class="absolute left-5 top-[42%] flex h-7 w-9 flex-col justify-center gap-1 rounded-[2px] bg-background-tertiary px-1.5">
          <span class="h-px bg-foreground-tertiary"></span>
          <span class="h-px w-2/3 bg-foreground-tertiary"></span>
        </span>
      </div>

      <p id="presence" class="w-full max-w-sm text-center text-sm text-pretty text-foreground-secondary md:col-start-2 md:row-start-1 md:max-w-none md:self-center md:text-start" aria-live="polite" hidden>Place the card.</p>

      <div id="data" class="w-full max-w-sm justify-self-center md:col-start-2 md:row-start-1 md:max-w-none md:justify-self-start">
        <p class="text-sm text-foreground-secondary">Balance</p>
        <p id="balance" class="mt-1 font-mono text-4xl font-medium tracking-tight tabular-nums md:text-5xl">¥4,820</p>
        <p class="mt-3 flex flex-wrap items-baseline justify-center gap-x-2 text-sm text-foreground-secondary md:justify-start">
          <span>IDm</span>
          <span id="idm" class="font-mono tabular-nums text-foreground-primary">012E456789ABCD01</span>
        </p>
      </div>

      <section id="history" class="w-full max-w-sm justify-self-center md:col-start-2 md:row-start-2 md:-mt-[calc(18rem*540/856-7.5rem)] md:max-w-xl md:justify-self-start" aria-label="History">
        <h2 class="text-center text-base font-medium md:text-start">History</h2>
        <div id="trips" class="mt-1 divide-y divide-border-line text-start">
          <div class="grid grid-cols-[minmax(0,1fr)_auto] items-baseline gap-x-3 py-3.5 sm:gap-x-4">
            <div class="min-w-0">
              <p class="font-medium">Shinjuku</p>
              <p class="flex flex-wrap gap-x-3 text-sm text-foreground-secondary"><span>14 Mar 2026</span><span>08:41</span></p>
            </div>
            <div class="shrink-0 text-right font-mono tabular-nums">
              <p class="font-medium">−¥160</p>
              <p class="text-sm text-foreground-secondary">¥4,820</p>
            </div>
          </div>
          <div class="grid grid-cols-[minmax(0,1fr)_auto] items-baseline gap-x-3 py-3.5 sm:gap-x-4">
            <div class="min-w-0">
              <p class="font-medium">Top up</p>
              <p class="flex flex-wrap gap-x-3 text-sm text-foreground-secondary"><span>14 Mar 2026</span><span>08:12</span></p>
            </div>
            <div class="shrink-0 text-right font-mono tabular-nums">
              <p class="font-medium">+¥2,000</p>
              <p class="text-sm text-foreground-secondary">¥4,980</p>
            </div>
          </div>
          <div class="grid grid-cols-[minmax(0,1fr)_auto] items-baseline gap-x-3 py-3.5 sm:gap-x-4">
            <div class="min-w-0">
              <p class="font-medium">Shibuya</p>
              <p class="flex flex-wrap gap-x-3 text-sm text-foreground-secondary"><span>13 Mar 2026</span><span>19:06</span></p>
            </div>
            <div class="shrink-0 text-right font-mono tabular-nums">
              <p class="font-medium">−¥200</p>
              <p class="text-sm text-foreground-secondary">¥2,980</p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
